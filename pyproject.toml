[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-coding-platform"
dynamic = ["version"]
description = "AI Coding Platform v2.1 — Local, Self-Hosted & GitHub Hybrid AI SDLC orchestration"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "AI Coding Platform contributors" }]
keywords = ["ai", "agents", "sdlc", "orchestration", "code-quality", "devsecops"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Runtime dependencies of Sprint S1. Later sprints add their own (see docs/adr/0002).
dependencies = [
  "typer>=0.15,<1",
  "rich>=13.9",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  # S2: persistence and structured logging (ADR-0005, ADR-0006)
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "structlog>=24.4",
  # S4: GitHub integration (ADR-0021)
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/aitmaganbetov/ai-coding-platform"
Documentation = "https://github.com/aitmaganbetov/ai-coding-platform/tree/main/docs"

[project.scripts]
ai-coding = "ai_coding.cli.app:main"

[project.optional-dependencies]
server = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.23",
  "import-linter>=2.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[tool.hatch.version]
path = "src/ai_coding/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coding"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_coding", "tests", "docs", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

# ---------------------------------------------------------------- tooling ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Deliberately insecure code samples that the bundled Semgrep rules must detect.
extend-exclude = ["tests/fixtures/semgrep"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PTH", "N", "PL", "TRY", "PERF",
]
ignore = [
  "PLR0913",  # Typer commands legitimately take many options
  "TRY003",   # descriptive exception messages are intended
  "PLR2004",  # magic values are fine in comparisons of well-named constants
  "RUF001", "RUF002", "RUF003",  # Cyrillic references to the ТЗ are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR2004", "S105", "S106", "S311", "SIM300"]
"src/ai_coding/git/local.py" = ["S603"]
"src/ai_coding/cli/commands/*.py" = ["PLR0917"]  # Typer maps options to parameters  # subprocess with argv list, no shell, validated input

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ai_coding"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "integration: tests that call real external binaries (git) or subprocesses",
  "docker: tests that need a running Docker daemon and the pinned tool images",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ai_coding"]
branch = true
# Alembic loads migration scripts by file path; they are exercised by
# tests/unit/test_persistence.py (upgrade, downgrade, schema-drift checks).
omit = ["*/ai_coding/persistence/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# Architectural layering (ADR-0003). Lower layers must never import higher ones.
[tool.importlinter]
root_package = "ai_coding"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "ai_coding.cli",
  "ai_coding.api",
  "ai_coding.workflows",
  "ai_coding.orchestrator",
  "ai_coding.reports",
  "ai_coding.quality",
  "ai_coding.tools | ai_coding.integrations | ai_coding.agents",
  "ai_coding.executors",
  "ai_coding.llm | ai_coding.persistence | ai_coding.config",
  "ai_coding.contracts | ai_coding.detection | ai_coding.git | ai_coding.observability",
  "ai_coding.security",
  "ai_coding.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no third-party I/O libraries)"
type = "forbidden"
source_modules = ["ai_coding.domain"]
forbidden_modules = [
  "typer", "rich", "yaml", "jsonschema", "pydantic", "subprocess", "sqlalchemy", "structlog",
]
