# tmux of the workspace terminals: the session survives closing the browser tab.
set -g default-terminal "xterm-256color"
set -g history-limit 50000
set -g mouse on
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #[bold]workspace#[nobold] "
set -g status-right " Shift+мышь — выделить текст · Ctrl+b c — новое окно "
set -g status-right-length 80
set -s escape-time 10
