# Reusable workflow: run test-python tests and publish JUnit results.
# Executes project code, so it runs only on GitHub-hosted, ephemeral runners.
name: test-python (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        default: "uv sync --frozen"
      test-command:
        type: string
        default: "uv run --frozen pytest --junitxml=junit.xml"

permissions: {}

jobs:
  test:
    name: test-python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      INSTALL_COMMAND: ${{ inputs.install-command }}
      TEST_COMMAND: ${{ inputs.test-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: bash -c "$INSTALL_COMMAND"
      - name: Test
        run: bash -c "$TEST_COMMAND"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-python-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/**/junit*.xml
          if-no-files-found: ignore
          retention-days: 14
