# Reusable workflow: run test-node tests and publish JUnit results.
# Executes project code, so it runs only on GitHub-hosted, ephemeral runners.
name: test-node (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      install-command:
        type: string
        default: "npm ci --ignore-scripts"
      test-command:
        type: string
        default: "npm test"

permissions: {}

jobs:
  test:
    name: test-node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      INSTALL_COMMAND: ${{ inputs.install-command }}
      TEST_COMMAND: ${{ inputs.test-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: bash -c "$INSTALL_COMMAND"
      - name: Test
        run: bash -c "$TEST_COMMAND"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-node-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/**/junit*.xml
          if-no-files-found: ignore
          retention-days: 14
