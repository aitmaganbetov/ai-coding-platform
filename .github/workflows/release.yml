# Reusable workflow: build, checksum, attest provenance and create a DRAFT release.
# Requires an environment (with required reviewers) so publishing has a human approval
# (ТЗ §9, FR-17). The release stays a draft until a maintainer publishes it.
name: release (reusable)

on:
  workflow_call:
    inputs:
      build-command:
        type: string
        required: true
      artifacts:
        description: Directory with the built artifacts
        type: string
        default: dist
      environment:
        description: Deployment environment that requires approval
        type: string
        default: release

permissions: {}

jobs:
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BUILD_COMMAND: ${{ inputs.build-command }}
      ARTIFACTS: ${{ inputs.artifacts }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Build
        run: bash -c "$BUILD_COMMAND"
      - name: Checksums
        run: |
          cd "$ARTIFACTS"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.artifacts }}/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" "$ARTIFACTS"/*
