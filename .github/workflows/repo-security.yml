# Security checks for the platform repository: secret scanning and dependency audit.
name: Repository security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.10.1"
  ACTIONLINT_PY_VERSION: "1.7.7.23"
  ZIZMOR_VERSION: "1.32.0"

jobs:
  secrets:
    name: Gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 .

  dependencies:
    name: Dependency audit (pip-audit / OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --all-groups --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Audit
        run: uvx "pip-audit==${PIP_AUDIT_VERSION}" --strict --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  workflows:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: actionlint
        run: uvx --from "actionlint-py==${ACTIONLINT_PY_VERSION}" actionlint -color
      - name: zizmor
        run: uvx "zizmor==${ZIZMOR_VERSION}" --offline --config .github/zizmor.yml .github/workflows
