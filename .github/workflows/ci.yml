# Continuous integration for the AI Coding Platform itself.
# Security notes (ТЗ §9):
#   * third-party actions are pinned to full commit SHAs (tag in trailing comment);
#   * least-privilege token: contents: read only;
#   * triggered by `pull_request` (never `pull_request_target`), so fork PRs run
#     unprivileged with a read-only token and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Verify lockfile is up to date
        run: uv lock --check
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Architecture layering (import-linter)
        run: uv run lint-imports
      - name: Schema drift check
        run: |
          uv run ai-coding config schema -o "$RUNNER_TEMP/schema.json"
          diff -u src/ai_coding/schemas/ai-coding.schema.json "$RUNNER_TEMP/schema.json"
      - name: Validate the repository's own .ai-coding.yml
        run: uv run ai-coding config validate .ai-coding.yml

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Pytest with coverage (fail under 80%)
        run: >-
          uv run pytest
          --cov --cov-report=term --cov-report=xml
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 14

  build:
    name: Build & smoke-test wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install wheel in a clean venv and run the CLI
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/ai-coding" --version
          "$RUNNER_TEMP/smoke/bin/ai-coding" --help
          mkdir "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/smoke/bin/ai-coding" init "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/smoke/bin/ai-coding" config validate "$RUNNER_TEMP/proj"
