# Continuous integration for the AI Coding Platform itself.
# Security notes (ТЗ §9):
#   * third-party actions are pinned to full commit SHAs (tag in trailing comment);
#   * least-privilege token: contents: read only;
#   * triggered by `pull_request` (never `pull_request_target`), so fork PRs run
#     unprivileged with a read-only token and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Verify lockfile is up to date
        run: uv lock --check
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Architecture layering (import-linter)
        run: uv run lint-imports
      - name: Schema drift check
        run: |
          uv run ai-coding config schema -o "$RUNNER_TEMP/schema.json"
          diff -u src/ai_coding/schemas/ai-coding.schema.json "$RUNNER_TEMP/schema.json"
      - name: Validate the repository's own .ai-coding.yml
        run: uv run ai-coding config validate .ai-coding.yml

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Pytest with coverage (fail under 80%)
        run: >-
          uv run pytest
          --cov --cov-report=term --cov-report=xml
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python }}.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 14

  sandbox:
    name: Sandbox, tools & self-audit (Docker)
    runs-on: ubuntu-24.04
    # S7: 14 tool images + offline data (Trivy DB, OSV DBs, Clippy toolchain).
    timeout-minutes: 50
    needs: [lint]
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install gitleaks on the host (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Pull digest-pinned tool images and prepare offline data
        run: |
          uv run ai-coding tools pull
          uv run ai-coding tools list --json | jq -r '.tools[] | "\(.tool)\t\(.image_state)\t\(.offline_data)"'
          df -h / | tail -1
      - name: Pull the digest-pinned base image used by the sandbox isolation tests
        # Keep in sync with ALPINE in tests/integration/conftest.py.
        run: docker pull --quiet alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      - name: Pull the digest-pinned PostgreSQL and S3 server used by the server tests
        # Keep in sync with POSTGRES_IMAGE (test_postgres.py) and S3_IMAGE (test_s3_real.py).
        run: |
          docker pull --quiet mirror.gcr.io/library/postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          docker pull --quiet mirror.gcr.io/versity/versitygw@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
      - name: Sandbox, audit and acceptance tests AC-01…AC-10 (no skips allowed)
        run: >-
          uv run pytest -m "docker or integration" -rs --junitxml=junit-sandbox.xml
          --acceptance-report=acceptance/acceptance.json
      - name: Acceptance matrix in the job summary
        if: always()
        run: if [ -f acceptance/acceptance.md ]; then cat acceptance/acceptance.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail if any Docker test was skipped
        run: |
          if grep -q '<skipped' junit-sandbox.xml; then
            echo "Docker/integration tests were skipped in the sandbox job" >&2
            exit 1
          fi
      - name: Self-audit of this repository (secrets + SAST, offline sandbox)
        run: |
          chmod -R a+rX .
          uv run ai-coding audit --backend docker --tool gitleaks --tool semgrep --output audit-out
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-audit-report
          path: |
            audit-out/
            junit-sandbox.xml
            acceptance/
          retention-days: 30

  build:
    name: Build & smoke-test wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install wheel in a clean venv and run the CLI
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/ai-coding" --version
          "$RUNNER_TEMP/smoke/bin/ai-coding" --help
          mkdir "$RUNNER_TEMP/proj"
          git -C "$RUNNER_TEMP/proj" init -q
          "$RUNNER_TEMP/smoke/bin/ai-coding" init "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/smoke/bin/ai-coding" config validate "$RUNNER_TEMP/proj"
          # Orchestrator end-to-end from the wheel: migrations, FSM, DAG, artifacts.
          "$RUNNER_TEMP/smoke/bin/ai-coding" run discover -C "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/smoke/bin/ai-coding" run list -C "$RUNNER_TEMP/proj"

  web:
    name: Web UI (typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built UI has no inline scripts (strict CSP)
        run: "! grep -E '<script>|<script type=\"module\">[^<]' dist/index.html"

  load:
    name: Load test (k6, API + workers on PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Pull the digest-pinned k6 and PostgreSQL images
        run: |
          uv run python - <<'PY' | xargs -n1 docker pull -q
          import importlib.util
          spec = importlib.util.spec_from_file_location("h", "loadtest/run_load.py")
          h = importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          print(h.K6_IMAGE); print(h.POSTGRES_IMAGE)
          PY
      - name: "Load test — thresholds: >=10 parallel runs, all complete, p95 reads, no errors"
        run: uv run python loadtest/run_load.py --out load-out
      - name: Results in the job summary
        if: always()
        run: if [ -f load-out/summary.md ]; then cat load-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test
          path: load-out/
          retention-days: 30

  server-image:
    name: Server image (Docker build & smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t ai-coding-platform:ci .
      - name: Validate the compose file
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - name: Run the API from the image and exercise it
        run: |
          mkdir -p "$RUNNER_TEMP/data/tmp" && sudo chown -R 10001:10001 "$RUNNER_TEMP/data"
          docker run -d --name api -p 127.0.0.1:8000:8000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges -v "$RUNNER_TEMP/data:/srv/ai-coding" \
            ai-coding-platform:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          test "$(docker exec api id -u)" = "10001"
          printf 'correct horse battery staple\n' \
            | docker exec -i api ai-coding server user add admin --admin --password-stdin
          token=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct horse battery staple"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:8000/api/v1/me -H "Authorization: Bearer $token"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/api/v1/projects | grep -q 401
      - name: Server logs
        if: always()
        run: docker logs api || true
