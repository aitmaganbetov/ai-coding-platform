# Reusable workflow: run test-php tests and publish JUnit results.
# Executes project code, so it runs only on GitHub-hosted, ephemeral runners.
name: test-php (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      php-version:
        type: string
        default: "8.3"
      install-command:
        type: string
        default: "composer install --no-interaction --prefer-dist --no-progress"
      test-command:
        type: string
        default: "vendor/bin/phpunit --log-junit junit.xml"

permissions: {}

jobs:
  test:
    name: test-php
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      INSTALL_COMMAND: ${{ inputs.install-command }}
      TEST_COMMAND: ${{ inputs.test-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: bash -c "$INSTALL_COMMAND"
      - name: Test
        run: bash -c "$TEST_COMMAND"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-php-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/**/junit*.xml
          if-no-files-found: ignore
          retention-days: 14
