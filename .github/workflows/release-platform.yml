# Release of the AI Coding Platform itself (S9, B-802/B-806). Triggered by a version tag.
#
#   build  — wheel + sdist, Web UI, SBOMs (CycloneDX) of the package and the UI, checksums
#   image  — server image to GHCR, its SBOM, signed with cosign (keyless) and attested
#   release (environment `release`, human approval) — SLSA build provenance and SBOM
#            attestations (Sigstore) for the files, cosign bundles, a DRAFT GitHub release
#   pypi   — only if the repository variable PYPI_PUBLISH is 'true' (trusted publishing,
#            environment `pypi`)
#
# Verify: docs/operations.md, «Проверка подлинности релиза».
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: 1
  PYTHONUTF8: 1

jobs:
  build:
    name: Build, SBOMs, checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - name: The tag is the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import ai_coding; print(ai_coding.__version__)')
          test "v$version" = "$TAG" || { echo "tag $TAG != package version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wheel and sdist
        run: uv build --out-dir dist
      - name: Web UI (bundled into the server image)
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: SBOMs (CycloneDX) of the package and the Web UI
        run: uv run python scripts/sbom.py --out dist/sbom
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz sbom/*.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  image:
    name: Server image (GHCR, signed, attested)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE="${IMAGE,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -f deploy/Dockerfile -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Image SBOM (Syft, no socket, no network)
        run: uv run python scripts/sbom.py --out sbom-image --no-web --image "${IMAGE,,}:$VERSION"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless, Sigstore)
        env:
          REF: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Build provenance (SLSA) of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation of the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-image/sbom-image.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: sbom-image/
          retention-days: 30

  release:
    name: Attest and draft the GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-image
          path: dist/sbom
      - name: Checksums are those of the build job
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - name: Build provenance (SLSA) of the wheel and sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: SBOM attestation of the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: dist/sbom/sbom-python.cdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sigstore bundles for offline verification
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Draft release (published by a maintainer)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "Server image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\` (\`$DIGEST\`)."
            echo
            echo "Changes: see CHANGELOG.md. Verification: docs/operations.md."
          } > notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md \
            dist/*.whl dist/*.tar.gz dist/*.sigstore.json dist/SHA256SUMS dist/sbom/*.json

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Only the distributions
        run: find dist -mindepth 1 ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
